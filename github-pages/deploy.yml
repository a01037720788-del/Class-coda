# ─────────────────────────────────────────────────────────────────────────────
#  사용 방법
#  이 파일을 저장소의  .github/workflows/deploy.yml  경로로 복사하세요.
#  (Base44 동기화 도구는 .github/workflows/ 파일을 직접 만들 수 없습니다)
#
#  저장소 설정 > Secrets and variables > Actions > Variables 에 추가:
#     VITE_SHEETS_API_URL = https://script.google.com/macros/s/…/exec
#
#  저장소 설정 > Pages > Source 를 "GitHub Actions" 로 선택하세요.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_SHEETS_API_URL: ${{ vars.VITE_SHEETS_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          CODA_TARGET: github-pages
        run: npm run build

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4