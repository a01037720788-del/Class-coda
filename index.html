<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA 기본 메타 -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CODA" />
    <meta name="msapplication-TileColor" content="#7c3aed" />

    <!-- SEO -->
    <meta name="description" content="CODA 학원 학습 플랫폼" />
    <meta property="og:title" content="CODA Practice Judge" />
    <meta property="og:description" content="CODA 학원 학습 플랫폼" />
    <meta property="og:type" content="website" />

    <title>CODA Practice Judge</title>

    <script>
      // ── GitHub Pages SPA 폴백 복원 ──
      // 404.html 이 넘겨준 경로(?/student/python)를 원래 URL 로 되돌립니다.
      // 서브패스 배포에서 새로고침 · 딥링크가 404 없이 동작하게 하는 처리입니다.
      (function (l) {
        if (l.search[1] !== '/') return;
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }(window.location));
    </script>

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.codaInstallPrompt = event;
        window.dispatchEvent(new Event('coda-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.codaInstallPrompt = null;
        window.codaInstalled = true;
      });
    </script>

    <style>
      /* Safe area (노치/홈바) */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* iOS pull-to-refresh 방지 */
      html { overscroll-behavior: none; }

      /* 스플래시 화면 */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: 88px; height: 88px;
        background: white; border-radius: 24px;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 900; color: #7c3aed;
        box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        margin-bottom: 20px;
        letter-spacing: -1px;
      }
      #splash-title {
        color: white; font-size: 22px; font-weight: 800;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.5px;
      }
      #splash-sub {
        color: rgba(255,255,255,0.65); font-size: 13px; margin-top: 8px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #splash-dots {
        display: flex; gap: 6px; margin-top: 40px;
      }
      #splash-dots span {
        width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4);
        animation: dot-pulse 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-pulse {
        0%, 80%, 100% { transform: scale(1); opacity: 0.4; }
        40% { transform: scale(1.4); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- 스플래시 화면 -->
    <div id="splash">
      <div id="splash-logo">C</div>
      <div id="splash-title">CODA Practice Judge</div>
      <div id="splash-sub">학원 학습 플랫폼</div>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script>
      (function () {
        var splash = document.getElementById('splash');
        var timer = setTimeout(function () {
          if (!splash.isConnected) return;
          document.getElementById('splash-sub').textContent = '화면을 불러오지 못했습니다. 다시 시도해 주세요.';
          document.getElementById('splash-dots').style.display = 'none';
          var button = document.createElement('button');
          button.textContent = '다시 불러오기';
          button.style.cssText = 'margin-top:24px;padding:12px 20px;border-radius:8px;background:white;color:#5b21b6';
          button.onclick = function () { location.reload(); };
          splash.appendChild(button);
        }, 15000);
        window.codaAppReady = function () { clearTimeout(timer); splash.remove(); };
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
